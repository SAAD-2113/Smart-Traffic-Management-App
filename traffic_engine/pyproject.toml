[project]
name = "traffic-engine"
version = "0.3.0"
description = "Traffic analysis and advisory signal-control engine for the Smart Traffic Management System (FYP prototype)"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_engine"]

[dependency-groups]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

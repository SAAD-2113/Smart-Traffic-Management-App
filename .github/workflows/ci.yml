name: CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and traffic engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Traffic engine tests
        working-directory: traffic_engine
        run: uv run --python 3.12 --group dev pytest -q
      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --python 3.12
          uv run pytest -q

  mobile:
    name: Flutter analyze, test and Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Configure release signing (only when the repository has the secrets)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
          } > android/key.properties
      - name: Build release APK
        run: flutter build apk --release --build-number ${{ github.run_number }}
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk smart-traffic-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smart-traffic-apk
          path: mobile/smart-traffic-*.apk
          retention-days: 30
      - name: Build manager dashboard for the web
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: smart-traffic-web
          path: mobile/build/web
          retention-days: 14

  release:
    name: Attach APK to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: smart-traffic-apk
      - uses: softprops/action-gh-release@v2
        with:
          files: smart-traffic-*.apk
          generate_release_notes: true

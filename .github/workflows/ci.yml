name: CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and traffic engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Traffic engine tests
        working-directory: traffic_engine
        run: uv run --python 3.12 --group dev pytest -q
      - name: Backend tests
        working-directory: backend
        run: |
          uv sync --python 3.12
          uv run pytest -q

  mobile:
    name: Flutter analyze, test and Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      # The pure-Dart firmware port has its own pubspec (dev dependency: package:test).
      # Without its pub get, `flutter analyze` below cannot resolve its tests.
      - name: v2i_core (firmware v3 port) dependencies and tests
        working-directory: mobile/packages/v2i_core
        run: |
          dart pub get
          dart test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Configure release signing (only when the repository has the secrets)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
          } > android/key.properties
      - name: Build release APK
        run: flutter build apk --release --build-number ${{ github.run_number }}
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk smart-traffic-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: smart-traffic-apk
          path: mobile/smart-traffic-*.apk
          retention-days: 30
      - name: Build manager dashboard for the web
        run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: smart-traffic-web
          path: mobile/build/web
          retention-days: 14

  release:
    # A push to main publishes the APK as release v<pubspec version> once per version (a new
    # version number on main = a new release); a pushed v* tag publishes that tag.
    name: Publish the APK as a GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [backend, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -m1 '^version:' mobile/pubspec.yaml | sed -E 's/^version: *//; s/\+.*//')
            echo "name=v$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip a version that is already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.tag.outputs.name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.tag.outputs.name }} exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.released.outputs.skip != 'true'
        with:
          name: smart-traffic-apk
      - name: Name the APK after the release
        if: steps.released.outputs.skip != 'true'
        run: mv smart-traffic-*.apk "smart-traffic-${{ steps.tag.outputs.name }}.apk"
      - uses: softprops/action-gh-release@v2
        if: steps.released.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Smart Traffic ${{ steps.tag.outputs.name }}
          files: smart-traffic-${{ steps.tag.outputs.name }}.apk
          body: |
            Android APK (one file for 64-bit and 32-bit ARM phones and x86_64 emulators), built by CI
            with `flutter build apk --release`. Android 7.0 or newer.

            Install: download the APK on the phone and open it (allow installing unknown apps).
            Unless the repository has release-key secrets, the APK is signed with a debug key:
            uninstall an older version first. See dist/README.md.
          generate_release_notes: true

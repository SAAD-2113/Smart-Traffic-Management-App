name: v2i_core
description: >-
  Pure-Dart port of the V2I firmware v3 (docs/firmware-v3): lane decision, packets, the
  intersection controller and the vehicle simulation. No Flutter imports, so it runs headless
  and in unit tests with a fake clock.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
